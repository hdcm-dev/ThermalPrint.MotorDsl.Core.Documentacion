name: Verificar
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificador de la ia-db (ENTREGA.md §3)
        run: python3 scripts/verificar_ia_db.py
