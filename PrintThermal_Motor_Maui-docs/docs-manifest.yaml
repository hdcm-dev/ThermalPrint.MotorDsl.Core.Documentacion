solution:
  name: MotorDsl
  repo_name: PrintThermal_Motor_Maui
  repo: https://github.com/Aplicada-Streaming/PrintThermal_Motor_Maui
  regulated: false          # no activa el perfil A.17 (dominio regulado)
  source_ref: v1.0.13 @83677eb
  version_strategy: unified # los 7 paquetes comparten versión (ver GLOSSARY: "Versión unificada")
  docs_root: PrintThermal_Motor_Maui-docs/
  ia_db: ia-db/

# -----------------------------------------------------------------------------
# Piezas de la solución con su type (Marco §7.1) y required_docs.
# state: draft = documentación generada por este pipeline, pendiente de revisión.
# -----------------------------------------------------------------------------
pieces:
  - id: MotorDsl.Core
    type: library
    tfm: [net10.0]
    path: src/MotorDsl.Core/
    criticality: high
    depends_on: []
    required_docs: [readme, api-reference, usage-guide]
    generated_docs: [readme, api-reference]
    ia_db_index: [01_nucleo-pipeline, 02_dsl-y-modelos]

  - id: MotorDsl.Parser
    type: library
    tfm: [net10.0]
    path: src/MotorDsl.Parser/
    criticality: high
    depends_on: [MotorDsl.Core]
    required_docs: [readme, api-reference, usage-guide]
    generated_docs: [readme, api-reference]
    ia_db_index: [02_dsl-y-modelos]

  - id: MotorDsl.Rendering
    type: library
    tfm: [net10.0]
    path: src/MotorDsl.Rendering/
    criticality: high
    depends_on: [MotorDsl.Core]
    required_docs: [readme, api-reference, usage-guide]
    generated_docs: [readme, api-reference]
    ia_db_index: [03_renderizado-base]

  - id: MotorDsl.Extensions
    type: library
    tfm: [net10.0]
    path: src/MotorDsl.Extensions/
    criticality: medium
    depends_on: [MotorDsl.Core, MotorDsl.Parser, MotorDsl.Rendering]
    required_docs: [readme, api-reference, usage-guide]
    generated_docs: [readme, api-reference]
    ia_db_index: [03_renderizado-base]

  - id: MotorDsl.Printing.Abstractions
    type: library
    tfm: [net10.0]
    path: src/MotorDsl.Printing.Abstractions/
    criticality: high
    depends_on: [MotorDsl.Core]
    required_docs: [readme, api-reference, usage-guide, extension-guide]
    generated_docs: [readme, api-reference, extension-guide]
    ia_db_index: [04_impresion-transports]

  - id: MotorDsl.Bluetooth
    type: library
    tfm: [net10.0-android, net10.0-ios]
    path: src/MotorDsl.Bluetooth/
    criticality: high
    depends_on: [MotorDsl.Printing.Abstractions]
    required_docs: [readme, api-reference, platform-notes]
    generated_docs: [readme, api-reference, platform-notes]
    ia_db_index: [04_impresion-transports]

  - id: MotorDsl.Maui
    type: component-library
    tfm: [net10.0-android, net10.0-ios]
    path: src/MotorDsl.Maui/
    criticality: high
    depends_on: [MotorDsl.Core, MotorDsl.Rendering, MotorDsl.Extensions, MotorDsl.Printing.Abstractions]
    required_docs: [readme, component-catalog, usage-guide]
    generated_docs: [readme, component-catalog, usage-guide]
    ia_db_index: [05_maui-ui-renderers]

  # --- Piezas de apoyo (no publicadas). type extendido para esta solución. ---
  - id: MotorDsl.Tests
    type: test-suite         # extensión del Marco (§7 es extensible)
    tfm: [net10.0]
    path: src/MotorDsl.Tests/
    criticality: medium
    depends_on: [MotorDsl.Core, MotorDsl.Parser, MotorDsl.Rendering, MotorDsl.Extensions, MotorDsl.Printing.Abstractions]
    required_docs: [test-inventory]
    generated_docs: [test-inventory]   # cubierto por ia-db/indexes/07_tests.md
    ia_db_index: [07_tests]

  - id: samples
    type: sample-app         # extensión del Marco; fuente de snippets de integración (§13)
    tfm: [net10.0-android, net10.0-ios]
    path: samples/
    criticality: low
    members: [MotorDsl.SampleApp, MotorDsl.MultaApp, MotorDsl.Integrated.MultaApp, MotorDsl.Nuget.MultaApp, MotorDsl.Nuget.Integrated.MultaApp]
    depends_on: [MotorDsl.Maui, MotorDsl.Bluetooth]
    required_docs: [readme, integration-snippets]
    generated_docs: [readme, integration-snippets]
    ia_db_index: [06_samples]

