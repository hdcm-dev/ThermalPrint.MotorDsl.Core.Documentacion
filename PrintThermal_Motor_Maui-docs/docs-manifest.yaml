# -----------------------------------------------------------------------------
# Vocabulario de doc_types y su vigencia (Marco §12.2).
# -----------------------------------------------------------------------------
doc_types:
  readme:              { path_pattern: "pieces/<id>/README.md",              max_age_days: 180 }
  api-reference:       { path_pattern: "pieces/<id>/api-reference.md",       max_age_days: 120 }
  usage-guide:         { path_pattern: "pieces/<id>/usage-guide.md",         max_age_days: 180 }
  component-catalog:   { path_pattern: "pieces/<id>/component-catalog.md",   max_age_days: 120 }
  extension-guide:     { path_pattern: "pieces/<id>/extension-guide.md",     max_age_days: 180 }
  platform-notes:      { path_pattern: "pieces/<id>/platform-notes.md",      max_age_days: 180 }
  integration-snippets:{ path_pattern: "pieces/samples/integration-snippets.md", max_age_days: 180 }
  test-inventory:      { path_pattern: "ia-db/indexes/07_tests.md",          max_age_days: 180 }

# -----------------------------------------------------------------------------
# Gap documental declarado (Marco §5, §9). Lo NO generado se declara aquí, no se omite.
# -----------------------------------------------------------------------------
gap:
  omitted_folders:        # carpetas del Marco §5.2 sin contenido reconstruible (omisión arc42)
    - 02-requirements     # requisitos formales RF-/RNF- no reconstruidos; existe doc previa CU-/RN- en docs/ (ver 09_docs-existentes)
    - 03-data             # la solución NO tiene base de datos propia; el "modelo" es el AST del DSL (documentado en 02-dsl-y-modelos)
    - 05-deployment       # sin infraestructura desplegable (son librerías); CI/CD en ia-db/08_build-devops
    - 06-security-compliance  # dominio no regulado; sin threat-model formal
    - 07-operations       # sin runbooks operativos (librerías, no servicios en ejecución)
  not_generated:
    - changelog-per-piece # existe un CHANGELOG.md único a nivel solución (solo v1.0.13); no hay changelog por paquete
    - openapi             # no aplica: no hay REST API en la solución (los samples consumen una API externa, fuera de alcance)
    - migration-guide     # sin breaking changes documentados entre versiones (historia previa a 1.0.13 ausente en CHANGELOG)
    - test-data-matrix    # §15 no solicitado (sin base de datos; sin {énfasis} de QA)
  notes:
    - "Existe documentación funcional previa extensa en docs/ (32 CU, reglas RN-/RC-, NB-); este pipeline la MAPEA (ia-db/09_docs-existentes) pero no la re-deriva a 02-requirements. Ver gap-documental.md."

agent_policy: docs/09-agents/agent-policy.md
